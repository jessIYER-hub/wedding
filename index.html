<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8f1e4">
  <title>Jessica &amp; Gaurav · 6 · 7 · 8 November 2027</title>
  <meta name="description" content="Our wedding in Udaipur. RSVP here; schedule, themes and travel coming soon.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,300;1,400;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
</head>
<!--
  The wedding website. The save the date lives in Canva; its
  "Share your details" button links here, to index.html#rsvp.
  All wording is in CONFIG (script.js). The old envelope save the date
  is still in save-the-date.html.
-->
<body data-page="site">

  <header class="topbar" id="topbar">
    <a class="topbar__mono" href="#home" aria-label="Home">
      <span class="mono mono--small" aria-hidden="true"><span>J</span><span>G</span></span>
    </a>
    <nav class="topbar__nav" aria-label="Sections">
      <a href="#rsvp" data-copy="site.nav.rsvp"></a>
      <a href="#schedule" data-copy="site.nav.schedule"></a>
      <a href="#themes" data-copy="site.nav.themes"></a>
      <a href="#travel" data-copy="site.nav.travel"></a>
      <a href="#faqs" data-copy="site.nav.faqs"></a>
    </nav>
  </header>

  <main>
    <!-- ============ HOME ============ -->
    <section class="hero" id="home" aria-label="Jessica and Gaurav">
      <!--
        MONOGRAM: to use the exact monogram from Canva, download it as a
        transparent PNG and save it as assets/monogram.png. Until then a
        lettered version is drawn instead.
      -->
      <div class="hero__mono rv">
        <img class="mono-img" src="assets/monogram.png" alt="" hidden>
        <span class="mono mono--large" aria-hidden="true"><span>J</span><span>G</span></span>
      </div>
      <p class="caps hero__eyebrow rv" data-copy="site.hero.eyebrow"></p>
      <h1 class="script hero__names rv" data-copy="namesLine"></h1>

      <figure class="hero__arch rv">
        <img src="assets/engagement/lake.jpg" alt="Jessica and Gaurav by the lake" loading="eager">
        <svg class="hero__arch-line" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true">
          <path d="M1 399 V128 C1 74 62 46 116 25 C133 18 145 10 150 1 C155 10 167 18 184 25 C238 46 299 74 299 128 V399 Z" />
        </svg>
      </figure>

      <p class="hero__dates rv" data-copy="site.hero.dates"></p>
      <p class="script hero__venue rv" id="venue-name"></p>
      <p class="caps hero__city rv" id="venue-city"></p>

      <div class="countdown hero__countdown rv" id="countdown" role="timer" aria-live="off">
        <div class="countdown__unit"><span class="countdown__num" data-unit="days">000</span><span class="caps countdown__label" data-copy="details.units.days"></span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="hours">00</span><span class="caps countdown__label" data-copy="details.units.hours"></span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="mins">00</span><span class="caps countdown__label" data-copy="details.units.mins"></span></div>
        <div class="countdown__unit"><span class="countdown__num" data-unit="secs">00</span><span class="caps countdown__label" data-copy="details.units.secs"></span></div>
      </div>

      <a class="btn btn--solid hero__cta rv" href="#rsvp" data-copy="site.hero.rsvpButton"></a>
    </section>

    <!-- ============ RSVP (live) ============ -->
    <section class="block block--rsvp" id="rsvp" aria-labelledby="rsvp-title">
      <div class="rsvp-card rv">
        <form class="rsvp" id="rsvp-form" novalidate>
          <h2 class="script rsvp__title" id="rsvp-title" data-copy="rsvp.title"></h2>
          <p class="rsvp__intro" data-copy="rsvp.intro"></p>

          <!-- Honeypot: real guests never see or fill this -->
          <div class="hp" aria-hidden="true">
            <label for="rsvp-website">Website</label>
            <input id="rsvp-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <div class="field">
            <label class="field__label caps" for="rsvp-name" data-copy="rsvp.name.label"></label>
            <input class="field__input" id="rsvp-name" name="name" type="text" autocomplete="name" required>
            <p class="field__error" data-error-for="name"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label caps" data-copy="rsvp.attending.label"></legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="attending" value="Yes" required><span data-copy="rsvp.attending.yes"></span></label>
              <label class="choice"><input type="radio" name="attending" value="No"><span data-copy="rsvp.attending.no"></span></label>
            </div>
            <p class="field__error" data-error-for="attending"></p>
          </fieldset>

          <div class="if-attending" id="if-attending" hidden>
            <div class="field">
              <label class="field__label caps" for="rsvp-party" data-copy="rsvp.party.label"></label>
              <select class="field__input field__select" id="rsvp-party" name="partySize"></select>
            </div>

            <div class="field" id="field-others" hidden>
              <label class="field__label caps" for="rsvp-others" data-copy="rsvp.others.label"></label>
              <p class="field__hint" id="rsvp-others-hint" data-copy="rsvp.others.hint"></p>
              <textarea class="field__input" id="rsvp-others" name="otherGuests" rows="2" aria-describedby="rsvp-others-hint"></textarea>
              <p class="field__error" data-error-for="otherGuests"></p>
            </div>

            <div class="field">
              <label class="field__label caps" for="rsvp-dietary" data-copy="rsvp.dietary.label"></label>
              <p class="field__hint" id="rsvp-dietary-hint" data-copy="rsvp.dietary.hint"></p>
              <textarea class="field__input" id="rsvp-dietary" name="dietary" rows="2" aria-describedby="rsvp-dietary-hint"></textarea>
            </div>

            <fieldset class="field" id="field-solo" hidden>
              <legend class="field__label caps" data-copy="rsvp.solo.label"></legend>
              <p class="field__hint" data-copy="rsvp.solo.hint"></p>
              <div class="choices choices--stacked" id="solo-choices"></div>
              <p class="field__error" data-error-for="solo"></p>
            </fieldset>
          </div>

          <div class="field">
            <label class="field__label caps" for="rsvp-message" data-copy="rsvp.message.label"></label>
            <p class="field__hint" id="rsvp-message-hint" data-copy="rsvp.message.hint"></p>
            <textarea class="field__input" id="rsvp-message" name="message" rows="3" aria-describedby="rsvp-message-hint"></textarea>
          </div>

          <p class="rsvp__error" id="rsvp-error" role="alert" hidden></p>

          <button class="btn btn--solid btn--wide" id="rsvp-submit" type="submit">
            <span class="btn__label" data-copy="rsvp.submit"></span>
            <span class="btn__sending" data-copy="rsvp.sending"></span>
          </button>
        </form>

        <div class="thanks" id="rsvp-thanks" hidden tabindex="-1">
          <p class="script thanks__title" id="thanks-title"></p>
          <p class="thanks__text" id="thanks-text"></p>
          <span class="rule rule--short" aria-hidden="true"></span>
          <p class="thanks__update" data-copy="thanks.update"></p>
          <button class="link-button" id="rsvp-again" type="button" data-copy="thanks.again"></button>
        </div>

      </div>
    </section>

    <!-- ============ COMING SOON SECTIONS (built from CONFIG.site.sections) ============ -->
    <div id="sections"></div>
  </main>

  <footer class="site-foot">
    <span class="mono mono--small" aria-hidden="true"><span>J</span><span>G</span></span>
    <p class="script site-foot__signoff" data-copy="signoff"></p>
  </footer>

  <!-- Pointed arch shape for the hero photo, matching the Canva arch -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <clipPath id="hero-arch" clipPathUnits="objectBoundingBox">
      <path d="M0 1 V0.33 C0 0.2 0.2 0.13 0.37 0.08 C0.43 0.06 0.48 0.035 0.5 0 C0.52 0.035 0.57 0.06 0.63 0.08 C0.8 0.13 1 0.2 1 0.33 V1 Z" />
    </clipPath>
  </svg>

  <script src="script.js"></script>
</body>
</html>
