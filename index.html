<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8f1e4">
  <title>Jessica &amp; Gaurav · Save the Date</title>
  <meta name="description" content="A little save-the-date for the people we love.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-locked">

  <!-- ============ GUEST GATE ============ -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate__card">
      <p class="display gate__names" data-copy="namesLine"></p>
      <span class="rule" aria-hidden="true"></span>
      <h2 class="caps gate__title" id="gate-title" data-copy="gate.title"></h2>
      <p class="gate__text" data-copy="gate.text"></p>
      <form class="gate__form" id="gate-form" novalidate>
        <label class="visually-hidden" for="gate-input" data-copy="gate.placeholder"></label>
        <input class="field__input gate__input" id="gate-input" name="passphrase" type="text"
               autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button class="btn btn--solid" type="submit" data-copy="gate.button"></button>
        <p class="gate__error" id="gate-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- Drifting petals: off by default (CONFIG.decor.petals) -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!--
    Each screen holds one 9:16 card. Everything inside a card is sized
    relative to the card, so it fits any phone without being cut off.
  -->
  <main class="screens" id="screens">

    <!-- ============ SCREEN 1 · LANDING ============ -->
    <section class="screen" id="landing" aria-label="We're getting married">
      <div class="card card--landing">

        <div class="landing__top">
          <p class="caps eyebrow reveal r-eyebrow" data-copy="landing.eyebrow"></p>
          <h1 class="names">
            <span class="display" data-copy="names.first"></span>
            <span class="display names__amp">&amp;</span>
            <span class="display" data-copy="names.second"></span>
          </h1>
        </div>

        <!-- Lotus-crowned arch frame (original SVG) holding the photo booth strip -->
        <div class="arch-frame">
          <svg class="arch-frame__svg" viewBox="0 0 160 404" aria-hidden="true">
            <path class="arch-frame__fill" d="M5 400 V92 C5 60 34 46 58 34 C70 28 77 20 80 8 C83 20 90 28 102 34 C126 46 155 60 155 92 V400 Z" />
            <path class="draw draw--gold" pathLength="1" d="M5 400 V92 C5 60 34 46 58 34 C70 28 77 20 80 8 C83 20 90 28 102 34 C126 46 155 60 155 92 V400 Z" />
            <path class="draw draw--blue" pathLength="1" d="M12 393 V95 C12 66 39 53 61 41 C72 35 78 28 80 19 C82 28 88 35 99 41 C121 53 148 66 148 95 V393 Z" />
          </svg>
          <div class="arch-frame__window">
            <!-- Photo booth strip: swap assets/strip-1..3.jpg -->
            <div class="strip strip--landing">
              <img src="assets/strip-1.jpg" alt="Jessica and Gaurav holding each other on a bridge in the park" loading="eager">
              <img src="assets/strip-2.jpg" alt="Jessica laughing in Gaurav's arms on a wooden bench" loading="eager">
              <img src="assets/strip-3.jpg" alt="Gaurav kissing Jessica's forehead by the lake" loading="eager">
              <span class="strip__caption caps" data-copy="initialsLine"></span>
            </div>
          </div>
        </div>

        <a class="open-prompt caps reveal r-prompt" href="#save-the-date" id="open-prompt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
          <span data-copy="landing.prompt"></span>
        </a>
      </div>
    </section>

    <!-- ============ SCREEN 2 · SAVE THE DATE ============ -->
    <section class="screen" id="save-the-date" aria-label="Save the date">
      <div class="card card--std">
        <div class="std">
          <div class="std__oval reveal r-oval">
            <svg class="oval-svg" viewBox="0 0 300 400" aria-hidden="true">
              <ellipse class="oval-svg__outer" cx="150" cy="200" rx="142" ry="190" />
              <ellipse class="oval-svg__inner" cx="150" cy="200" rx="124" ry="170" />
            </svg>
            <div class="std__text">
              <h2 class="display std__title" data-copy="saveTheDate.title"></h2>
              <p class="std__date" data-copy="saveTheDate.date"></p>
              <span class="rule rule--short" aria-hidden="true"></span>
              <p class="caps std__sub" data-copy="saveTheDate.sub"></p>
            </div>
          </div>


          <!--
            DECOR SLOT: flowers / ribbon artwork.
            Set CONFIG.decor.flowers (e.g. "assets/flowers.png") and CONFIG.decor.ribbon
            in script.js and the images will be placed here. Transparent PNGs work best.
          -->
          <div class="decor-slot decor-slot--flowers" id="decor-flowers" aria-hidden="true"></div>
          <div class="decor-slot decor-slot--ribbon" id="decor-ribbon" aria-hidden="true"></div>

          <!-- Tilted strip: swap assets/strip-4..6.jpg -->
          <div class="strip strip--tilted reveal r-strip">
            <img src="assets/strip-4.jpg" alt="Jessica and Gaurav walking up stone steps hand in hand" loading="lazy">
            <img src="assets/strip-5.jpg" alt="Jessica and Gaurav smiling at each other under the trees" loading="lazy">
            <img src="assets/strip-6.jpg" alt="Jessica showing her engagement ring" loading="lazy">
          </div>

          <p class="monogram reveal r-mono" aria-hidden="true" data-copy="initialsLine"></p>
        </div>

        <p class="std__line reveal r-line" data-copy="saveTheDate.line"></p>
      </div>
    </section>

    <!-- ============ SCREEN 3 · WHERE & WHEN, COUNTDOWN, RSVP ============ -->
    <section class="screen" id="details" aria-label="Where, when and RSVP">
      <div class="card card--details">

        <!-- The reveal: the arch draws itself, then the dates and venue are written in -->
        <div class="venue-arch" id="venue-arch">
          <svg class="venue-arch__svg" viewBox="0 0 300 400" aria-hidden="true">
            <path class="venue-arch__fill" d="M2 398 V120 C2 70 60 42 114 22 C132 15 145 9 150 2 C155 9 168 15 186 22 C240 42 298 70 298 120 V398 Z" />
            <path class="vdraw vdraw--gold" pathLength="1" d="M2 398 V120 C2 70 60 42 114 22 C132 15 145 9 150 2 C155 9 168 15 186 22 C240 42 298 70 298 120 V398 Z" />
            <path class="vdraw vdraw--blue" pathLength="1" d="M12 388 V123 C12 77 67 51 118 32 C135 25 146 19 150 13 C154 19 165 25 182 32 C233 51 288 77 288 123 V388 Z" />
          </svg>
          <div class="venue-arch__inside">
            <p class="rv rv-2 caps inside__eyebrow" data-copy="reveal.eyebrow"></p>
            <p class="rv rv-3 inside__days" data-copy="reveal.days"></p>
            <p class="rv rv-4 caps inside__month" data-copy="reveal.month"></p>
            <span class="rv rv-5 rule rule--short inside__rule" aria-hidden="true"></span>
            <div class="inside__venue-wrap" id="venue-revealed" hidden>
              <p class="display inside__venue" id="venue-name"></p>
              <p class="rv rv-7 caps inside__city" id="venue-city" hidden></p>
              <a class="rv rv-7 inside__link" id="venue-link" target="_blank" rel="noopener" hidden></a>
            </div>
            <p class="rv rv-6 inside__teaser" id="venue-teaser" data-copy="reveal.teaser"></p>
          </div>
        </div>

        <div class="details__lower">
          <p class="caps eyebrow reveal r-2" data-copy="details.countdownEyebrow"></p>
          <div class="countdown reveal r-2" id="countdown" role="timer" aria-live="off">
            <div class="countdown__unit"><span class="countdown__num" data-unit="days">000</span><span class="caps countdown__label" data-copy="details.units.days"></span></div>
            <div class="countdown__unit"><span class="countdown__num" data-unit="hours">00</span><span class="caps countdown__label" data-copy="details.units.hours"></span></div>
            <div class="countdown__unit"><span class="countdown__num" data-unit="mins">00</span><span class="caps countdown__label" data-copy="details.units.mins"></span></div>
            <div class="countdown__unit"><span class="countdown__num" data-unit="secs">00</span><span class="caps countdown__label" data-copy="details.units.secs"></span></div>
          </div>

          <p class="details__formal reveal r-3" data-copy="details.formalLine"></p>

          <button class="btn btn--solid btn--rsvp reveal r-3" id="rsvp-open" type="button"
                  aria-haspopup="dialog" aria-controls="rsvp-sheet" data-copy="details.rsvpButton"></button>

          <p class="caps signoff reveal r-4" data-copy="signoff"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ RSVP SHEET (slides up over the card) ============ -->
  <div class="sheet" id="rsvp-sheet" role="dialog" aria-modal="true" aria-labelledby="rsvp-title" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel">
      <button class="sheet__close" type="button" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        <span class="visually-hidden" data-copy="rsvp.close"></span>
      </button>
      <div class="sheet__scroll" id="sheet-scroll">

        <form class="rsvp" id="rsvp-form" novalidate>
          <h2 class="display rsvp__title" id="rsvp-title" data-copy="rsvp.title"></h2>
          <p class="rsvp__intro" data-copy="rsvp.intro"></p>

          <!-- Honeypot: real guests never see or fill this -->
          <div class="hp" aria-hidden="true">
            <label for="rsvp-website">Website</label>
            <input id="rsvp-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <div class="field">
            <label class="field__label caps" for="rsvp-name" data-copy="rsvp.name.label"></label>
            <input class="field__input" id="rsvp-name" name="name" type="text" autocomplete="name" required>
            <p class="field__error" data-error-for="name"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label caps" data-copy="rsvp.attending.label"></legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="attending" value="Yes" required><span data-copy="rsvp.attending.yes"></span></label>
              <label class="choice"><input type="radio" name="attending" value="No"><span data-copy="rsvp.attending.no"></span></label>
            </div>
            <p class="field__error" data-error-for="attending"></p>
          </fieldset>

          <div class="if-attending" id="if-attending" hidden>
            <div class="field">
              <label class="field__label caps" for="rsvp-party" data-copy="rsvp.party.label"></label>
              <select class="field__input field__select" id="rsvp-party" name="partySize"></select>
            </div>

            <div class="field" id="field-others" hidden>
              <label class="field__label caps" for="rsvp-others" data-copy="rsvp.others.label"></label>
              <p class="field__hint" id="rsvp-others-hint" data-copy="rsvp.others.hint"></p>
              <textarea class="field__input" id="rsvp-others" name="otherGuests" rows="2" aria-describedby="rsvp-others-hint"></textarea>
              <p class="field__error" data-error-for="otherGuests"></p>
            </div>

            <div class="field">
              <label class="field__label caps" for="rsvp-dietary" data-copy="rsvp.dietary.label"></label>
              <p class="field__hint" id="rsvp-dietary-hint" data-copy="rsvp.dietary.hint"></p>
              <textarea class="field__input" id="rsvp-dietary" name="dietary" rows="2" aria-describedby="rsvp-dietary-hint"></textarea>
            </div>

            <fieldset class="field" id="field-solo" hidden>
              <legend class="field__label caps" data-copy="rsvp.solo.label"></legend>
              <p class="field__hint" data-copy="rsvp.solo.hint"></p>
              <div class="choices choices--stacked" id="solo-choices"></div>
              <p class="field__error" data-error-for="solo"></p>
            </fieldset>
          </div>

          <div class="field">
            <label class="field__label caps" for="rsvp-message" data-copy="rsvp.message.label"></label>
            <p class="field__hint" id="rsvp-message-hint" data-copy="rsvp.message.hint"></p>
            <textarea class="field__input" id="rsvp-message" name="message" rows="3" aria-describedby="rsvp-message-hint"></textarea>
          </div>

          <p class="rsvp__error" id="rsvp-error" role="alert" hidden></p>

          <button class="btn btn--solid btn--wide" id="rsvp-submit" type="submit">
            <span class="btn__label" data-copy="rsvp.submit"></span>
            <span class="btn__sending" data-copy="rsvp.sending"></span>
          </button>
        </form>

        <div class="thanks" id="rsvp-thanks" hidden tabindex="-1">
          <p class="display thanks__title" id="thanks-title"></p>
          <p class="thanks__text" id="thanks-text"></p>
          <span class="rule rule--short" aria-hidden="true"></span>
          <p class="thanks__update" data-copy="thanks.update"></p>
          <button class="link-button" id="rsvp-again" type="button" data-copy="thanks.again"></button>
        </div>

      </div>
    </div>
  </div>

  <!-- Shared SVG definitions. Colours come from CSS variables in styles.css. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color: var(--gold-soft)" />
        <stop offset="0.5" style="stop-color: var(--gold)" />
        <stop offset="1" style="stop-color: var(--gold-soft)" />
      </linearGradient>


    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
