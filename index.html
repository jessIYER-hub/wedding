<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf7ef">
  <title>Jessica &amp; Gaurav</title>
  <meta name="description" content="For our family and friends.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-locked">
  <!--
    This file holds no wedding details. Everything guests see once they're in
    (home, story, schedule, travel, Q&A) comes from the Apps Script only after
    their name and phone/email match a "Yes" RSVP. See README.md.
  -->

  <a class="skip-link" href="#main" data-copy="nav.skip"></a>

  <!-- ============ GATE (the only thing visitors see) ============ -->
  <div class="gate" id="gate">
    <div class="gate__card">
      <svg class="motif motif--gate" viewBox="0 0 120 40" aria-hidden="true"><use href="#ring-divider" /></svg>
      <h1 class="script gate__names" data-copy="couple.names"></h1>
      <span class="rule" aria-hidden="true"></span>
      <p class="gate__line" data-copy="gate.line"></p>

      <p class="gate__loading caps" id="gate-loading" data-copy="gate.loading" hidden></p>

      <form class="gate__form" id="gate-form" novalidate>
        <p class="caps gate__prompt" id="gate-prompt" data-copy="gate.prompt"></p>
        <div class="field">
          <label class="field__label caps" for="gate-name" data-copy="gate.nameLabel"></label>
          <input class="field__input" id="gate-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label class="field__label caps" for="gate-contact" data-copy="gate.contactLabel"></label>
          <input class="field__input" id="gate-contact" name="contact" type="text" autocomplete="email" inputmode="email"
                 autocapitalize="none" spellcheck="false" required aria-describedby="gate-hint">
          <p class="field__hint" id="gate-hint" data-copy="gate.hint"></p>
        </div>
        <p class="gate__error" id="gate-error" role="alert" aria-live="polite"></p>
        <button class="pill pill--solid" id="gate-submit" type="submit">
          <span class="pill__label" data-copy="gate.button"></span>
          <span class="pill__sending" data-copy="gate.checking"></span>
        </button>
        <p class="gate__help" data-copy="gate.help"></p>
      </form>
      <span class="band" aria-hidden="true"></span>
    </div>
  </div>

  <!-- ============ NAV (shown once a guest is in) ============ -->
  <header class="nav" id="nav" hidden>
    <div class="nav__bar">
      <a class="nav__brand script" href="#home" data-copy="couple.initials"></a>
      <button class="nav__toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav__toggle-lines" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="visually-hidden" data-copy="nav.menu"></span>
      </button>
      <nav class="nav__menu" id="nav-menu" aria-label="Main">
        <ul class="nav__list" id="nav-list"></ul>
        <a class="nav__rsvp" href="#rsvp" data-nav="rsvp" data-copy="nav.rsvp"></a>
      </nav>
    </div>
  </header>

  <!-- ============ SITE (filled in from the Apps Script reply) ============ -->
  <main class="site" id="main" hidden>
    <section class="section section--home" id="home" aria-labelledby="home-title"></section>
    <section class="section section--story" id="story" aria-labelledby="story-title"></section>
    <section class="section section--schedule" id="schedule" aria-labelledby="schedule-title"></section>
    <section class="section section--travel" id="travel" aria-labelledby="travel-title"></section>
    <section class="section section--faqs" id="faqs" aria-labelledby="faqs-title"></section>
    <section class="section section--rsvp" id="rsvp" aria-labelledby="rsvp-title"></section>

    <footer class="footer">
      <svg class="motif" viewBox="0 0 120 40" aria-hidden="true"><use href="#ring-divider" /></svg>
      <p class="script footer__signoff" data-copy="footer.signoff"></p>
      <span class="band" aria-hidden="true"></span>
      <button class="link-button caps" id="sign-out" type="button" data-copy="footer.signOut"></button>
    </footer>
  </main>

  <!-- Shared SVG symbols (original line work) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#d9c48e" />
        <stop offset="0.5" stop-color="#b8975a" />
        <stop offset="1" stop-color="#dcc996" />
      </linearGradient>

      <!-- Divider: the ring seen side on. A fine gold band with the flower in the middle. -->
      <symbol id="ring-divider" viewBox="0 0 120 40">
        <!-- Solid gold here: a gradient on a perfectly flat line doesn't paint. -->
        <g fill="none" stroke="#b8975a" stroke-linecap="round">
          <path d="M4 19.4 H 43 M 77 19.4 H 116" stroke-width="0.8" />
          <path d="M14 21.4 H 43 M 77 21.4 H 106" stroke-width="0.5" opacity="0.7" />
        </g>
        <circle cx="2" cy="20" r="1.2" fill="url(#gold-grad)" />
        <circle cx="118" cy="20" r="1.2" fill="url(#gold-grad)" />
        <use href="#ring-flower" x="41" y="1" width="38" height="38" />
      </symbol>

      <!-- A leafy sprig with little flowers like the engagement ring -->
      <symbol id="sprig" viewBox="0 0 120 120">
        <g fill="none" stroke-width="1" stroke-linecap="round" style="stroke: var(--sage)">
          <path d="M6 114 C 30 90, 52 70, 70 40 C 78 26, 88 16, 104 8" />
          <path d="M36 86 C 30 74, 32 64, 40 58 C 44 68, 42 78, 36 86 Z" />
          <path d="M52 66 C 60 60, 70 60, 76 66 C 68 72, 58 72, 52 66 Z" />
          <path d="M62 50 C 56 40, 58 30, 64 24 C 68 34, 68 42, 62 50 Z" />
          <path d="M24 98 C 16 92, 14 84, 18 78 C 24 84, 26 92, 24 98 Z" />
        </g>
        <use href="#ring-flower" x="92" y="-4" width="24" height="24" />
        <use href="#ring-flower" x="76" y="28" width="16" height="16" />
      </symbol>

      <!-- The flower from the engagement ring: six pointed marquise petals with
           facet lines, smaller petals tucked between, and a round centre stone. -->
      <symbol id="ring-flower" viewBox="0 0 40 40">
        <g fill="none" stroke="url(#gold-grad)" stroke-linejoin="round">
          <g stroke-width="0.6" opacity="0.75">
            <path id="rf-small" d="M20 20 C 18.2 17, 18.2 12.5, 20 9.5 C 21.8 12.5, 21.8 17, 20 20 Z" transform="rotate(30 20 20)" />
            <use href="#rf-small" transform="rotate(60 20 20)" />
            <use href="#rf-small" transform="rotate(120 20 20)" />
            <use href="#rf-small" transform="rotate(180 20 20)" />
            <use href="#rf-small" transform="rotate(240 20 20)" />
            <use href="#rf-small" transform="rotate(300 20 20)" />
          </g>
          <g stroke-width="0.9">
            <g id="rf-petal">
              <path d="M20 20 C 16.2 15, 16.4 7.5, 20 2.5 C 23.6 7.5, 23.8 15, 20 20 Z" style="fill: var(--paper)" />
              <path d="M20 4.5 V 17.5 M 20 4.5 L 18.1 11 L 20 17.5 M 20 4.5 L 21.9 11 L 20 17.5" stroke-width="0.35" opacity="0.7" />
            </g>
            <use href="#rf-petal" transform="rotate(60 20 20)" />
            <use href="#rf-petal" transform="rotate(120 20 20)" />
            <use href="#rf-petal" transform="rotate(180 20 20)" />
            <use href="#rf-petal" transform="rotate(240 20 20)" />
            <use href="#rf-petal" transform="rotate(300 20 20)" />
          </g>
        </g>
        <circle cx="20" cy="20" r="3" style="fill: var(--paper)" stroke="url(#gold-grad)" stroke-width="0.9" />
        <path d="M18.2 20 L 20 18.2 L 21.8 20 L 20 21.8 Z" fill="none" stroke="url(#gold-grad)" stroke-width="0.35" />
      </symbol>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
