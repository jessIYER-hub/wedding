<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf7ef">
  <title>Jessica &amp; Gaurav · Save the Date</title>
  <meta name="description" content="A little save-the-date for the people we love.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-locked">

  <!-- ============ GUEST GATE ============ -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate__card">
      <svg class="gate__lotus" viewBox="0 0 100 60" aria-hidden="true"><use href="#lotus" /></svg>
      <p class="script gate__names" data-copy="namesLine"></p>
      <span class="rule" aria-hidden="true"><svg viewBox="0 0 100 60"><use href="#lotus" /></svg></span>
      <h2 class="caps gate__title" id="gate-title" data-copy="gate.title"></h2>
      <p class="gate__text" data-copy="gate.text"></p>
      <form class="gate__form" id="gate-form" novalidate>
        <label class="visually-hidden" for="gate-input" data-copy="gate.placeholder"></label>
        <input class="field__input gate__input" id="gate-input" name="passphrase" type="text"
               autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button class="pill pill--solid" type="submit" data-copy="gate.button"></button>
        <p class="gate__error" id="gate-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- Drifting petals (filled in by script.js) -->
  <div class="petals" id="petals" aria-hidden="true"></div>

  <!-- ============ MUSIC (hidden until CONFIG.music.src is set) ============ -->
  <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>
    <span class="visually-hidden" data-copy="music.label"></span>
  </button>
  <audio id="bg-music" loop preload="none"></audio>

  <main class="screens" id="screens">

    <!-- ============ SCREEN 1 · LANDING ============ -->
    <section class="screen screen--landing" id="landing" aria-label="We're getting married">
      <!-- Toran garland (built by script.js) -->
      <div class="toran" id="toran" aria-hidden="true"></div>

      <div class="landing__top">
        <p class="caps eyebrow reveal r-eyebrow" data-copy="landing.eyebrow"></p>
        <h1 class="names">
          <span class="script" data-copy="names.first"></span>
          <span class="script names__amp">&amp;</span>
          <span class="script" data-copy="names.second"></span>
        </h1>
      </div>

      <!-- Lotus-crowned arch frame (original SVG) holding the photo booth strip -->
      <div class="arch-frame">
        <svg class="arch-frame__svg" viewBox="0 0 180 440" aria-hidden="true">
          <path class="arch-frame__fill" d="M6 436 V128 C6 84 40 62 70 44 C82 37 88 26 90 10 C92 26 98 37 110 44 C140 62 174 84 174 128 V436 Z" />
          <path class="draw draw--gold" pathLength="1" d="M6 436 V128 C6 84 40 62 70 44 C82 37 88 26 90 10 C92 26 98 37 110 44 C140 62 174 84 174 128 V436 Z" />
          <path class="draw draw--blue" pathLength="1" d="M14 428 V131 C14 92 45 72 74 53 C84 47 88 39 90 27 C92 39 96 47 106 53 C135 72 166 92 166 131 V428 Z" />
          <path class="draw draw--dots" pathLength="1" d="M21 421 V134 C21 99 50 80 77 62 C85 57 88 50 90 42 C92 50 95 57 103 62 C130 80 159 99 159 134 V421 Z" />
          <!-- hanging bells at the springing points -->
          <g class="bells">
            <path d="M6 128 V146 M174 128 V146" />
            <circle cx="6" cy="150" r="3.4" />
            <circle cx="174" cy="150" r="3.4" />
          </g>
          <use class="arch-frame__crest" href="#lotus" x="58" y="-18" width="64" height="38" />
          <use class="arch-frame__base" href="#lotus" x="72" y="424" width="36" height="22" />
        </svg>
        <div class="arch-frame__window">
          <!-- Photo booth strip: swap assets/strip-1..3.jpg -->
          <div class="strip strip--landing">
            <img src="assets/strip-1.jpg" alt="Jessica and Gaurav by the lake" loading="eager">
            <img src="assets/strip-2.jpg" alt="Jessica laughing with Gaurav on a wooden bench" loading="eager">
            <img src="assets/strip-3.jpg" alt="Jessica and Gaurav under the trees by a lamppost" loading="eager">
            <span class="strip__caption caps" data-copy="initialsLine"></span>
          </div>
        </div>
      </div>

      <a class="open-prompt caps reveal r-prompt" href="#save-the-date" id="open-prompt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
        <span data-copy="landing.prompt"></span>
      </a>
    </section>

    <!-- ============ SCREEN 2 · SAVE THE DATE ============ -->
    <section class="screen screen--std" id="save-the-date" aria-label="Save the date">
      <div class="std">
        <div class="std__oval reveal r-oval">
          <svg class="oval-svg" viewBox="0 0 300 400" aria-hidden="true">
            <path class="oval-svg__scallop" id="oval-scallop" />
            <ellipse class="oval-svg__inner" cx="150" cy="200" rx="124" ry="170" />
            <ellipse class="oval-svg__inner oval-svg__inner--fine" cx="150" cy="200" rx="116" ry="162" />
          </svg>
          <div class="std__text">
            <h2 class="script std__title" data-copy="saveTheDate.title"></h2>
            <p class="std__date" data-copy="saveTheDate.date"></p>
            <span class="rule rule--short" aria-hidden="true"><svg viewBox="0 0 100 60"><use href="#lotus" /></svg></span>
            <p class="caps std__sub" data-copy="saveTheDate.sub"></p>
          </div>
        </div>

        <svg class="std__crest reveal r-crest" viewBox="0 0 100 60" aria-hidden="true"><use href="#lotus" /></svg>

        <!--
          DECOR SLOT: flowers / ribbon artwork.
          Set CONFIG.decor.flowers (e.g. "assets/flowers.png") and CONFIG.decor.ribbon
          in script.js and the images will be placed here. Transparent PNGs work best.
        -->
        <div class="decor-slot decor-slot--flowers" id="decor-flowers" aria-hidden="true"></div>
        <div class="decor-slot decor-slot--ribbon" id="decor-ribbon" aria-hidden="true"></div>

        <!-- Tilted strip: swap assets/strip-4..6.jpg -->
        <div class="strip strip--tilted reveal r-strip">
          <img src="assets/strip-4.jpg" alt="Jessica and Gaurav walking up stone steps hand in hand" loading="lazy">
          <img src="assets/strip-5.jpg" alt="Jessica showing her engagement ring" loading="lazy">
          <img src="assets/strip-6.jpg" alt="Jessica and Gaurav by the water" loading="lazy">
        </div>

        <div class="lockets" aria-hidden="true">
          <svg class="locket locket--one reveal r-locket-1" viewBox="0 0 100 110"><use href="#locket" /><text x="50" y="72" class="locket__initial" data-copy="names.initials.0"></text></svg>
          <svg class="locket locket--two reveal r-locket-2" viewBox="0 0 100 110"><use href="#locket" /><text x="50" y="72" class="locket__initial" data-copy="names.initials.1"></text></svg>
        </div>
      </div>

      <p class="std__line reveal r-line" data-copy="saveTheDate.line"></p>
    </section>

    <!-- ============ SCREEN 3 · REVEAL, COUNTDOWN & RSVP ============ -->
    <section class="screen screen--details" id="details" aria-label="Where, when and RSVP">
      <div class="details">

        <!-- The big reveal: palace doors open onto the dates and venue -->
        <div class="reveal-doors reveal r-1" id="reveal-doors">
          <div class="reveal-doors__arch">
            <div class="reveal-doors__clip">
            <div class="reveal-doors__inside">
              <svg class="inside__lotus" viewBox="0 0 100 60" aria-hidden="true"><use href="#lotus" /></svg>
              <p class="caps inside__eyebrow" data-copy="reveal.eyebrow"></p>
              <p class="inside__days" data-copy="reveal.days"></p>
              <p class="caps inside__month" data-copy="reveal.month"></p>
              <span class="rule rule--short inside__rule" aria-hidden="true"><svg viewBox="0 0 100 60"><use href="#lotus" /></svg></span>
              <div id="venue-revealed" hidden>
                <p class="script inside__venue" id="venue-name"></p>
                <p class="caps inside__city" id="venue-city" hidden></p>
                <a class="inside__link caps" id="venue-link" target="_blank" rel="noopener" hidden></a>
              </div>
              <p class="inside__teaser" id="venue-teaser" data-copy="reveal.teaser"></p>
            </div>

            <div class="door door--left" aria-hidden="true"><div class="door__panel"><span class="door__ring"></span></div></div>
            <div class="door door--right" aria-hidden="true"><div class="door__panel"><span class="door__ring"></span></div></div>
            </div>

            <svg class="reveal-doors__outline" viewBox="0 0 300 400" aria-hidden="true">
              <path d="M1 399 V120 C1 68 60 40 114 20 C132 13 145 7 150 1 C155 7 168 13 186 20 C240 40 299 68 299 120 V399 Z" />
            </svg>
          </div>
          <button class="pill reveal-doors__btn" id="reveal-btn" type="button" aria-controls="reveal-doors">
            <span data-copy="reveal.button"></span>
          </button>
        </div>

        <p class="caps eyebrow reveal r-2" data-copy="details.countdownEyebrow"></p>
        <div class="countdown reveal r-2" id="countdown" role="timer" aria-live="off">
          <div class="countdown__unit"><span class="countdown__num" data-unit="days">000</span><span class="caps countdown__label" data-copy="details.units.days"></span></div>
          <div class="countdown__unit"><span class="countdown__num" data-unit="hours">00</span><span class="caps countdown__label" data-copy="details.units.hours"></span></div>
          <div class="countdown__unit"><span class="countdown__num" data-unit="mins">00</span><span class="caps countdown__label" data-copy="details.units.mins"></span></div>
          <div class="countdown__unit"><span class="countdown__num" data-unit="secs">00</span><span class="caps countdown__label" data-copy="details.units.secs"></span></div>
        </div>

        <p class="details__formal reveal r-3" data-copy="details.formalLine"></p>

        <button class="pill pill--rsvp reveal r-3" id="rsvp-toggle" type="button"
                aria-expanded="false" aria-controls="rsvp-panel" data-copy="details.rsvpButton"></button>

        <!-- ============ RSVP ============ -->
        <div class="rsvp-panel" id="rsvp-panel">
          <div class="rsvp-panel__inner">

            <form class="rsvp" id="rsvp-form" novalidate>
              <p class="rsvp__intro" data-copy="rsvp.intro"></p>

              <!-- Honeypot: real guests never see or fill this -->
              <div class="hp" aria-hidden="true">
                <label for="rsvp-website">Website</label>
                <input id="rsvp-website" name="website" type="text" tabindex="-1" autocomplete="off">
              </div>

              <div class="field">
                <label class="field__label caps" for="rsvp-name" data-copy="rsvp.name.label"></label>
                <input class="field__input" id="rsvp-name" name="name" type="text" autocomplete="name" required>
                <p class="field__error" data-error-for="name"></p>
              </div>

              <fieldset class="field">
                <legend class="field__label caps" data-copy="rsvp.attending.label"></legend>
                <p class="field__hint" data-copy="rsvp.attending.hint"></p>
                <div class="choices">
                  <label class="choice"><input type="radio" name="attending" value="Yes" required><span data-copy="rsvp.attending.yes"></span></label>
                  <label class="choice"><input type="radio" name="attending" value="No"><span data-copy="rsvp.attending.no"></span></label>
                </div>
                <p class="field__error" data-error-for="attending"></p>
              </fieldset>

              <div class="if-attending" id="if-attending" hidden>
                <div class="field">
                  <label class="field__label caps" for="rsvp-party" data-copy="rsvp.party.label"></label>
                  <select class="field__input field__select" id="rsvp-party" name="partySize"></select>
                </div>

                <div class="field" id="field-others" hidden>
                  <label class="field__label caps" for="rsvp-others" data-copy="rsvp.others.label"></label>
                  <p class="field__hint" id="rsvp-others-hint" data-copy="rsvp.others.hint"></p>
                  <textarea class="field__input" id="rsvp-others" name="otherGuests" rows="2" aria-describedby="rsvp-others-hint"></textarea>
                  <p class="field__error" data-error-for="otherGuests"></p>
                </div>

                <div class="field">
                  <label class="field__label caps" for="rsvp-dietary" data-copy="rsvp.dietary.label"></label>
                  <p class="field__hint" id="rsvp-dietary-hint" data-copy="rsvp.dietary.hint"></p>
                  <textarea class="field__input" id="rsvp-dietary" name="dietary" rows="2" aria-describedby="rsvp-dietary-hint"></textarea>
                </div>

                <fieldset class="field" id="field-solo" hidden>
                  <legend class="field__label caps" data-copy="rsvp.solo.label"></legend>
                  <p class="field__hint" data-copy="rsvp.solo.hint"></p>
                  <div class="choices choices--stacked" id="solo-choices"></div>
                  <p class="field__error" data-error-for="solo"></p>
                </fieldset>
              </div>

              <div class="field">
                <label class="field__label caps" for="rsvp-message" data-copy="rsvp.message.label"></label>
                <p class="field__hint" id="rsvp-message-hint" data-copy="rsvp.message.hint"></p>
                <textarea class="field__input" id="rsvp-message" name="message" rows="3" aria-describedby="rsvp-message-hint"></textarea>
              </div>

              <p class="rsvp__error" id="rsvp-error" role="alert" hidden></p>

              <button class="pill pill--solid" id="rsvp-submit" type="submit">
                <span class="pill__label" data-copy="rsvp.submit"></span>
                <span class="pill__sending" data-copy="rsvp.sending"></span>
              </button>
            </form>

            <div class="thanks" id="rsvp-thanks" hidden tabindex="-1">
              <svg class="thanks__lotus" viewBox="0 0 100 60" aria-hidden="true"><use href="#lotus" /></svg>
              <p class="script thanks__title" id="thanks-title"></p>
              <p class="thanks__text" id="thanks-text"></p>
              <span class="rule rule--short" aria-hidden="true"><svg viewBox="0 0 100 60"><use href="#lotus" /></svg></span>
              <p class="thanks__update" data-copy="thanks.update"></p>
              <button class="link-button caps" id="rsvp-again" type="button" data-copy="thanks.again"></button>
            </div>

          </div>
        </div>

        <footer class="signoff reveal r-3">
          <p class="script signoff__script" data-copy="signoff"></p>
        </footer>
      </div>
    </section>
  </main>

  <!-- Shared SVG artwork (all original). Colours come from CSS variables in styles.css. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color: var(--gold-soft)" />
        <stop offset="0.5" style="stop-color: var(--gold)" />
        <stop offset="1" style="stop-color: var(--gold-soft)" />
      </linearGradient>
      <linearGradient id="enamel-grad" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" style="stop-color: var(--royal-light)" />
        <stop offset="1" style="stop-color: var(--royal)" />
      </linearGradient>

      <!-- Blue lotus -->
      <symbol id="lotus" viewBox="0 0 100 60" overflow="visible">
        <g style="stroke: var(--gold); stroke-width: 0.9; stroke-linejoin: round">
          <path style="fill: var(--lotus-outer)" d="M50 53 C33 53 15 44 6 29 C23 28 40 37 50 53 Z" />
          <path style="fill: var(--lotus-outer)" d="M50 53 C67 53 85 44 94 29 C77 28 60 37 50 53 Z" />
          <path style="fill: var(--lotus-mid)" d="M50 52 C38 46 27 32 27 15 C39 22 48 35 50 52 Z" />
          <path style="fill: var(--lotus-mid)" d="M50 52 C62 46 73 32 73 15 C61 22 52 35 50 52 Z" />
          <path style="fill: var(--lotus-inner)" d="M50 4 C59 18 60 37 50 52 C40 37 41 18 50 4 Z" />
        </g>
        <path d="M24 57 Q50 62 76 57" style="fill: none; stroke: var(--gold); stroke-width: 0.9; stroke-linecap: round" />
        <circle cx="50" cy="1" r="1.4" style="fill: var(--gold)" />
      </symbol>

      <!-- Heart locket, blue enamel with gold edge -->
      <symbol id="locket" viewBox="0 0 100 110">
        <circle cx="50" cy="12" r="6" fill="none" stroke="url(#gold-grad)" stroke-width="2" />
        <path d="M50 104 C 22 84, 6 66, 6 46 C 6 30, 17 20, 31 20 C 40 20, 46 25, 50 32 C 54 25, 60 20, 69 20 C 83 20, 94 30, 94 46 C 94 66, 78 84, 50 104 Z"
              fill="url(#enamel-grad)" stroke="url(#gold-grad)" stroke-width="3" />
        <path d="M50 94 C 27 78, 14 63, 14 47 C 14 35, 22 28, 32 28 C 40 28, 46 33, 50 40 C 54 33, 60 28, 68 28 C 78 28, 86 35, 86 47 C 86 63, 73 78, 50 94 Z"
              fill="none" stroke="url(#gold-grad)" stroke-width="0.9" stroke-dasharray="1.5 2.5" />
      </symbol>

      <!-- Arch shape for the reveal doors (scales with the box) -->
      <clipPath id="arch-clip" clipPathUnits="objectBoundingBox">
        <path d="M0 1 V0.3 C0 0.17 0.2 0.1 0.38 0.05 C0.44 0.032 0.483 0.017 0.5 0 C0.517 0.017 0.56 0.032 0.62 0.05 C0.8 0.1 1 0.17 1 0.3 V1 Z" />
      </clipPath>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
